[tool.poetry]
name = "certificate-registry"
version = "0.1.0"
description = "Algorand smart contract for registering and verifying SHA-256 certificate hashes on-chain."
authors = ["SarveshManulal"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = "^4.0.0"
algorand-python-testing = "^1"

[tool.poetry.group.dev.dependencies]
algokit-client-generator = "^2.1.0"
puyapy = "*"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
